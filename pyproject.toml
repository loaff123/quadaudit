[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quadaudit"
version = "0.1.0a1"
description = "Exact-reference quadrature reliability experiments with auditable work budgets"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "QuadAudit contributors"}]
dependencies = []

[project.optional-dependencies]
solvers = ["scipy>=1.15,<2", "mpmath>=1.3,<2"]
dev = ["build>=1,<2", "ruff==0.13.0"]

[project.scripts]
quadaudit = "quadaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quadaudit = ["data/*.jsonl", "data/*.json"]

[tool.ruff]
line-length = 100

name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: ruff check src tests scripts corpus
      - run: ruff format --check src tests scripts corpus
      - run: python -m unittest discover -s tests -v
      - run: python corpus/freeze.py
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
  solvers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[solvers]'
      - run: python -m unittest discover -s tests -v
      - run: quadaudit verify
      - run: quadaudit run --per-family 1 --output smoke-run --trace 16
      - run: quadaudit report smoke-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}-${{ matrix.python }}
          path: smoke-run/
